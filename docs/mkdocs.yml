docs_dir: mkdocs
site_name: Hypline
repo_name: princeton-ddss/hypline
repo_url: https://github.com/princeton-ddss/hypline
copyright: Copyright &copy; 2025–2026 The Trustees of Princeton University

theme:
  name: material
  logo: images/logo.svg
  favicon: images/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            heading_level: 4
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Tutorials:
    - Run the full pipeline on the example dataset: tutorials/walkthrough.md
  - Step-by-step guides:
    - Step 1. Prepare your data:
      - Hypline dataset layout: step-by-step/layout.md
      - Prepare your own dataset: step-by-step/prepare-dataset.md
      - Segments and metadata: step-by-step/segments.md
    - Step 2. Run the hypline pipeline (CLI):
      - Overview: step-by-step/overview.md
      - Generate features and confounds:
        - hypline transcribe: step-by-step/transcribe.md
        - hypline featuregen: step-by-step/featuregen.md
        - hypline confoundgen: step-by-step/confoundgen.md
      - Denoise fMRI data:
        - hypline denoise: step-by-step/denoise.md
      - Run encoding models:
        - hypline encoding: step-by-step/encoding.md
    - Step 3. Review your features and results (Python API):
      - Features and confounds: step-by-step/python-api.md
      - Encoding results: step-by-step/encoding-results.md
  - FAQ:
    - How the encoding model works: FAQ/how-encoding-works.md    
    - Feature families: FAQ/feature-families.md
    - Filter to specific runs or conditions: FAQ/filter.md
    - Regenerate outputs after a fix: FAQ/regenerate.md
    - Test cross-brain effects from evaluation results: FAQ/analyze-evals.md
    - Glossary: FAQ/glossary.md

